<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>WASTED CITY — Tower Defense</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="crt">
    <div id="game-wrap">
      <header id="hud">
        <h1 class="logo">WASTED<span>CITY</span></h1>
        <div class="stats">
          <div class="stat cash"><span class="label">$</span><span id="cash">0</span></div>
          <div class="stat lives"><span class="label">LIVES</span><span id="lives">0</span></div>
          <div class="stat wave"><span class="label">WAVE</span><span id="wave">0</span></div>
        </div>
      </header>

      <div id="stage">
        <canvas id="canvas" width="640" height="640"></canvas>

        <!-- Tower shop -->
        <aside id="shop">
          <h2>GANGS FOR HIRE</h2>
          <div id="tower-list"></div>

          <!-- Upgrade / sell panel for a selected tower -->
          <div id="tower-panel" class="tower-panel hidden">
            <div class="tp-head">
              <span id="tp-title">—</span>
              <button id="tp-close" title="Deselect">✕</button>
            </div>
            <div id="tp-stats" class="tp-stats"></div>
            <div class="tp-actions">
              <button id="tp-upgrade" class="btn small">UPGRADE</button>
              <button id="tp-sell" class="btn small sell">SELL</button>
            </div>
          </div>

          <button id="start-wave" class="btn">SEND NEXT WAVE</button>
          <p id="hint" class="hint">Pick a gang, then tap an empty lot to deploy.</p>
        </aside>

        <!-- Overlays -->
        <div id="overlay" class="overlay hidden">
          <div class="panel">
            <h2 id="overlay-title">WASTED CITY</h2>
            <p id="overlay-text"></p>
            <button id="overlay-btn" class="btn big">START</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>
</html>
